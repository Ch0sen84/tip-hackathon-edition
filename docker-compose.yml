services:
  tip-hackathon:
    build:
      context: .
      # Build-time version/commit info (2026-10-15) -- see Dockerfile's
      # ARG comment and backend/app/version.py. Pass real values with,
      # e.g.: BUILD_COMMIT=$(git rev-parse HEAD) BUILD_VERSION=$(git
      # describe --tags --always) docker compose build. Left at the
      # default "unknown" if unset, which the app shows honestly as
      # "unknown installed version" rather than guessing.
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      # Configurable bind address/port, SAFE-BY-DEFAULT (loopback only).
      # See .env.example's BIND_HOST/BIND_PORT for how to open this to your
      # LAN -- do not set BIND_HOST=0.0.0.0 unless you specifically intend
      # to expose this on every network interface (the Settings UI's
      # credential-management endpoints have no additional auth of their
      # own; they rely entirely on this network-level binding for
      # protection). Run tools/check_deployment_binding.sh after deploying
      # to verify the actual published binding matches what you intended.
      - "${BIND_HOST:-127.0.0.1}:${BIND_PORT:-8000}:8000"
    environment:
      TIP_MODE: ${TIP_MODE:-demo}
      UW_API_KEY: ${UW_API_KEY:-}
      UW_BASE_URL: ${UW_BASE_URL:-https://api.unusualwhales.com}
      UW_CLIENT_API_ID: ${UW_CLIENT_API_ID:-}
      TIP_LIVE_WATCHLIST: ${TIP_LIVE_WATCHLIST:-SPY,QQQ,NVDA,TSLA}
      # REAL BUG FIX (2026-10-14): settings_store.py defaults
      # TIP_SETTINGS_PATH to "./data/settings.json", resolved relative to
      # the app's /srv/backend working directory -- i.e. /srv/backend/
      # data/settings.json. The volume below has ALWAYS been mounted at
      # /srv/data, a completely separate sibling directory. Settings
      # (saved UW/AI keys, live-mode activation, verification state) have
      # never actually survived a container recreation on this
      # deployment -- discovered when a routine code-fix redeploy wiped a
      # real hand-configured Live Mode setup. Pointing the settings file
      # explicitly inside the already-mounted volume fixes this for real,
      # not just for this one redeploy.
      TIP_SETTINGS_PATH: /srv/data/settings.json
      # APPROVED 2026-10-14: real MCP-protocol transport for Investigate
      # with AI's tool execution (see mcp_tool_client.py). Default stays
      # "rest" for anyone else cloning the repo -- zero behavior change
      # for them; N5's own .env overrides this to "mcp" for the genuine
      # end-to-end verification test. NOT the same thing as the always-
      # genuine-MCP standalone "Test UW MCP Connection" button in
      # Settings, which never depended on this variable.
      INVESTIGATE_TRANSPORT: ${INVESTIGATE_TRANSPORT:-rest}
      # Local Mode / Network Mode (Fetch Metadata auth redesign): leave
      # unset ("auto", the default) for every normal install -- Local
      # Mode activates automatically iff BIND_HOST above is loopback.
      # Only set this explicitly if you want to FORCE Network Mode's
      # token model even on a loopback-bound install (TIP_LOCAL_MODE=0),
      # or you understand the guard in core/local_mode.py and are
      # deliberately asserting Local Mode (TIP_LOCAL_MODE=1) -- doing
      # the latter against a non-loopback BIND_HOST makes this app
      # refuse to start, loudly, by design. See README.md "Local Mode /
      # Network Mode" for the full design and unsupported topologies.
      TIP_LOCAL_MODE: ${TIP_LOCAL_MODE:-auto}
      # REAL BUG FIX (Windows Docker Desktop QA round 2, findings B1/B2):
      # BIND_HOST/BIND_PORT were used ABOVE in the `ports:` line to decide
      # what this container is actually published on, but were never
      # forwarded into the container's own environment -- so the app
      # process running inside the container could never see what it was
      # really published on, and always fell back to its code-level
      # defaults (127.0.0.1:8000) for Local Mode's loopback-safety
      # decision (core/local_mode.py) and for computing which Origin to
      # accept (app/main.py's ALLOWED_ORIGIN/ALLOWED_ORIGINS). Concretely,
      # this meant: (B1) a custom BIND_PORT (e.g. 18000) made every
      # protected browser action 403 because the app still computed its
      # allowed Origin as port 8000; (B2 -- SECURITY-CRITICAL) setting
      # BIND_HOST=0.0.0.0 to publish on the LAN did NOT turn off Local
      # Mode's zero-token bypass inside the container, because the
      # container never learned BIND_HOST was anything other than the
      # 127.0.0.1 default -- i.e. a LAN-exposed instance could silently
      # keep running with zero authentication. Forwarding the SAME
      # ${BIND_HOST:-127.0.0.1}/${BIND_PORT:-8000} shell variables used in
      # the `ports:` mapping above into the container's real environment
      # makes the Compose-level publish and the in-container decision
      # derive from one shared source, structurally unable to diverge --
      # see core/local_mode.py's module docstring and
      # tests/test_compose_config_rendering.py for the regression test
      # that renders this exact file and asserts the two stay consistent
      # for the default, custom-port, and BIND_HOST=0.0.0.0 cases.
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      BIND_PORT: ${BIND_PORT:-8000}
      # QA remediation D9: these were all already read from the
      # environment by the app (app/scheduler.py's _env_int calls,
      # live_uw_adapter.py's TIP_UW_MAX_CONCURRENT_REQUESTS), but were
      # never actually forwarded by this Compose file -- so setting them
      # in a deployment's .env had zero real effect inside the
      # container; only the hardcoded code-level defaults ever applied.
      # Forwarded now so they are genuinely configurable per-deployment.
      # Defaults match the existing code-level defaults exactly -- zero
      # behavior change for anyone who doesn't set these.
      TIP_SCHEDULER_TOP_N: ${TIP_SCHEDULER_TOP_N:-5}
      TIP_SCHEDULER_INTERVAL_S: ${TIP_SCHEDULER_INTERVAL_S:-900}
      TIP_SCHEDULER_LEASE_TTL_S: ${TIP_SCHEDULER_LEASE_TTL_S:-90}
      TIP_SCHEDULER_POLL_S: ${TIP_SCHEDULER_POLL_S:-20}
      # Do NOT raise this above 2 without re-verifying UW's real
      # concurrency ceiling (see live_uw_adapter.py's
      # DEFAULT_MAX_CONCURRENT_REQUESTS docstring) -- kept here only so
      # it is genuinely configurable, never to suggest raising it.
      TIP_UW_MAX_CONCURRENT_REQUESTS: ${TIP_UW_MAX_CONCURRENT_REQUESTS:-2}
    volumes:
      - tip-data:/srv/data

volumes:
  tip-data:
